<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif"><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1B1F2A" flood-opacity="0.10"/></filter><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6475"/></marker><marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B3FD6"/></marker></defs><rect width="1200" height="720" fill="#F4F6FB"/><text x="40" y="46" font-size="12" fill="#5B3FD6" font-weight="700" text-anchor="start" xml:space="preserve">TAREA 1 · PASO A</text><text x="40" y="76" font-size="24" fill="#1B1F2A" font-weight="700" text-anchor="start" xml:space="preserve">Desplegar gpt-5-mini con Custom settings</text><text x="40" y="100" font-size="14" fill="#5B6475" font-weight="400" text-anchor="start" xml:space="preserve">Discover → Models → gpt-5-mini → Deploy → Custom settings</text><g filter="url(#sh)"><rect x="40" y="128" width="700" height="560" rx="14" fill="#FFFFFF" stroke="#D9DEE8" stroke-width="1" /></g><path d="M40 142 a14 14 0 0 1 14 -14 h672 a14 14 0 0 1 14 14 v32 h-700 z" fill="#FAFBFE"/><line x1="40" y1="174" x2="740" y2="174" stroke="#D9DEE8"/><circle cx="62" cy="151" r="5.5" fill="#FF5F57"/><circle cx="80" cy="151" r="5.5" fill="#FEBC2E"/><circle cx="98" cy="151" r="5.5" fill="#28C840"/><text x="130" y="156" font-size="14" fill="#1B1F2A" font-weight="600" text-anchor="start" xml:space="preserve">Deploy gpt-5-mini</text><text x="722" y="156" font-size="12" fill="#5B6475" font-weight="400" text-anchor="end" xml:space="preserve">Custom settings</text><text x="96" y="206" font-size="12.5" fill="#5B6475" font-weight="600" text-anchor="start" xml:space="preserve">Deployment name</text><rect x="96" y="214" width="600" height="38" rx="8" fill="#FFFFFF" stroke="#D9DEE8" stroke-width="1" /><text x="108" y="238.0" font-size="14" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">gpt-5-mini</text><text x="96" y="278" font-size="12.5" fill="#5B6475" font-weight="600" text-anchor="start" xml:space="preserve">Deployment type</text><rect x="96" y="286" width="600" height="38" rx="8" fill="#ECE8FF" stroke="#5B3FD6" stroke-width="2" /><text x="108" y="310.0" font-size="14" fill="#1B1F2A" font-weight="600" text-anchor="start" xml:space="preserve">Data Zone Standard</text><path d="M673 302.0 l5 6 l5 -6" fill="none" stroke="#5B6475" stroke-width="2"/><circle cx="74" cy="305.0" r="13" fill="#5B3FD6"/><text x="74" y="310.0" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><text x="96" y="350" font-size="12.5" fill="#5B6475" font-weight="600" text-anchor="start" xml:space="preserve">Model version</text><rect x="96" y="358" width="600" height="38" rx="8" fill="#FFFFFF" stroke="#D9DEE8" stroke-width="1" /><text x="108" y="382.0" font-size="14" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">(predeterminada)</text><path d="M673 374.0 l5 6 l5 -6" fill="none" stroke="#5B6475" stroke-width="2"/><text x="96" y="422" font-size="12.5" fill="#5B6475" font-weight="600" text-anchor="start" xml:space="preserve">Tokens per Minute Rate Limit</text><circle cx="74" cy="452" r="13" fill="#5B3FD6"/><text x="74" y="457" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" xml:space="preserve">2</text><rect x="96" y="440" width="600" height="24" rx="4" fill="#fff" stroke="#fff" stroke-width="1" /><line x1="96" y1="452" x2="696" y2="452" stroke="#D9DEE8" stroke-width="6" stroke-linecap="round"/><line x1="96" y1="452" x2="296" y2="452" stroke="#5B3FD6" stroke-width="6" stroke-linecap="round"/><circle cx="296" cy="452" r="11" fill="#fff" stroke="#5B3FD6" stroke-width="3"/><line x1="396" y1="434" x2="396" y2="470" stroke="#B4570B" stroke-width="2" stroke-dasharray="4 3"/><text x="396" y="488" font-size="11.5" fill="#B4570B" font-weight="700" text-anchor="middle" xml:space="preserve">150K = límite de la política</text><text x="96" y="488" font-size="11.5" fill="#5B6475" font-weight="400" text-anchor="start" xml:space="preserve">0</text><text x="696" y="488" font-size="11.5" fill="#5B6475" font-weight="400" text-anchor="end" xml:space="preserve">300K</text><rect x="616" y="404" width="80" height="26" rx="6" fill="#5B3FD6" stroke="#5B3FD6" stroke-width="1" /><text x="656" y="422" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" xml:space="preserve">100,000</text><text x="96" y="516" font-size="12.5" fill="#5B6475" font-weight="600" text-anchor="start" xml:space="preserve">Guardrails</text><rect x="96" y="524" width="600" height="38" rx="8" fill="#FFFFFF" stroke="#D9DEE8" stroke-width="1" /><text x="108" y="548.0" font-size="14" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">Microsoft.DefaultV2 (predeterminado)</text><path d="M673 540.0 l5 6 l5 -6" fill="none" stroke="#5B6475" stroke-width="2"/><rect x="576" y="620" width="120" height="38" rx="8" fill="#5B3FD6" stroke="#5B3FD6" stroke-width="1" /><text x="636.0" y="644" font-size="14" fill="#fff" font-weight="600" text-anchor="middle" xml:space="preserve">Deploy</text><circle cx="718" cy="639" r="13" fill="#5B3FD6"/><text x="718" y="644" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" xml:space="preserve">3</text><rect x="440" y="620" width="120" height="38" rx="8" fill="#fff" stroke="#D9DEE8" stroke-width="1" /><text x="500.0" y="644" font-size="14" fill="#1B1F2A" font-weight="600" text-anchor="middle" xml:space="preserve">Cancel</text><rect x="780" y="150" width="380" height="144" rx="12" fill="#ECE8FF" stroke="#5B3FD6" stroke-width="1.2" /><rect x="780" y="150" width="6" height="144" rx="3" fill="#5B3FD6"/><text x="800" y="178" font-size="14.5" fill="#5B3FD6" font-weight="700" text-anchor="start" xml:space="preserve">Qué pide el enunciado</text><text x="800" y="204" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">• Modelo: gpt-5-mini</text><text x="800" y="226" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">• Tipo: Data Zone Standard</text><text x="800" y="248" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">• Custom settings (no Default)</text><text x="800" y="270" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">• TPM menor a 150,000</text><rect x="780" y="368" width="380" height="122" rx="12" fill="#FFF1E3" stroke="#B4570B" stroke-width="1.2" /><rect x="780" y="368" width="6" height="122" rx="3" fill="#B4570B"/><text x="800" y="396" font-size="14.5" fill="#B4570B" font-weight="700" text-anchor="start" xml:space="preserve">Tip para no fallar</text><text x="800" y="422" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">Cualquier valor por debajo de 150K</text><text x="800" y="444" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">cumple. Usa 100K: queda claro y</text><text x="800" y="466" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">lejos del límite. Evita 150K exacto.</text><rect x="780" y="562" width="380" height="100" rx="12" fill="#E3F5EC" stroke="#0F8A5F" stroke-width="1.2" /><rect x="780" y="562" width="6" height="100" rx="3" fill="#0F8A5F"/><text x="800" y="590" font-size="14.5" fill="#0F8A5F" font-weight="700" text-anchor="start" xml:space="preserve">Guardrail</text><text x="800" y="616" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">Para gpt-5-mini no se pide guardrail:</text><text x="800" y="638" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">deja el predeterminado.</text></svg>