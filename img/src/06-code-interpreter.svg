<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif"><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1B1F2A" flood-opacity="0.10"/></filter><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6475"/></marker><marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B3FD6"/></marker></defs><rect width="1200" height="420" fill="#F4F6FB"/><text x="40" y="46" font-size="12" fill="#5B3FD6" font-weight="700" text-anchor="start" xml:space="preserve">TAREA 2 · HERRAMIENTA</text><text x="40" y="76" font-size="24" fill="#1B1F2A" font-weight="700" text-anchor="start" xml:space="preserve">Cómo trabaja Code Interpreter con Northwind.xlsx</text><text x="40" y="100" font-size="14" fill="#5B6475" font-weight="400" text-anchor="start" xml:space="preserve">El archivo se sube a la herramienta; el agente escribe y ejecuta Python en un sandbox</text><rect x="40" y="150" width="250" height="200" rx="16" fill="#fff" stroke="#1B1F2A" stroke-width="1.6" /><circle cx="70" cy="182" r="13" fill="#1B1F2A"/><text x="70" y="187" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><text x="64" y="232" font-size="15" fill="#1B1F2A" font-weight="700" text-anchor="start" xml:space="preserve">C:\files</text><text x="64" y="262" font-size="16" fill="#1B1F2A" font-weight="700" text-anchor="start" font-family="Cascadia Code, Consolas, Menlo, monospace" xml:space="preserve">Northwind.xlsx</text><text x="64" y="300" font-size="13" fill="#5B6475" font-weight="400" text-anchor="start" xml:space="preserve">Archivo en la VM del lab</text><path d="M294 250 L324 250" stroke="#5B6475" stroke-width="2.2" marker-end="url(#arr)"/><rect x="330" y="150" width="250" height="200" rx="16" fill="#ECE8FF" stroke="#5B3FD6" stroke-width="1.6" /><circle cx="360" cy="182" r="13" fill="#5B3FD6"/><text x="360" y="187" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" xml:space="preserve">2</text><text x="354" y="232" font-size="15" fill="#5B3FD6" font-weight="700" text-anchor="start" xml:space="preserve">Tools → Code interpreter</text><text x="354" y="262" font-size="16" fill="#1B1F2A" font-weight="700" text-anchor="start" font-family="Cascadia Code, Consolas, Menlo, monospace" xml:space="preserve">Upload files</text><text x="354" y="300" font-size="13" fill="#5B6475" font-weight="400" text-anchor="start" xml:space="preserve">Se adjunta a la herramienta</text><path d="M584 250 L614 250" stroke="#5B6475" stroke-width="2.2" marker-end="url(#arr)"/><rect x="620" y="150" width="250" height="200" rx="16" fill="#E3F5EC" stroke="#0F8A5F" stroke-width="1.6" /><circle cx="650" cy="182" r="13" fill="#0F8A5F"/><text x="650" y="187" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" xml:space="preserve">3</text><text x="644" y="232" font-size="15" fill="#0F8A5F" font-weight="700" text-anchor="start" xml:space="preserve">Sandbox Python</text><text x="644" y="262" font-size="16" fill="#1B1F2A" font-weight="700" text-anchor="start" xml:space="preserve">pandas · cálculos</text><text x="644" y="300" font-size="13" fill="#5B6475" font-weight="400" text-anchor="start" xml:space="preserve">El agente genera y corre código</text><path d="M874 250 L904 250" stroke="#5B6475" stroke-width="2.2" marker-end="url(#arr)"/><rect x="910" y="150" width="250" height="200" rx="16" fill="#E6F0FC" stroke="#1F6FD1" stroke-width="1.6" /><circle cx="940" cy="182" r="13" fill="#1F6FD1"/><text x="940" y="187" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" xml:space="preserve">4</text><text x="934" y="232" font-size="15" fill="#1F6FD1" font-weight="700" text-anchor="start" xml:space="preserve">Respuesta</text><text x="934" y="262" font-size="16" fill="#1B1F2A" font-weight="700" text-anchor="start" xml:space="preserve">Tablas y totales</text><text x="934" y="300" font-size="13" fill="#5B6475" font-weight="400" text-anchor="start" xml:space="preserve">Solo con datos del Excel</text><text x="40" y="392" font-size="13" fill="#B4570B" font-weight="600" text-anchor="start" xml:space="preserve">Si el agente responde sin ejecutar código o con datos inventados, revisa que el archivo esté adjunto a Code interpreter y guarda de nuevo.</text></svg>