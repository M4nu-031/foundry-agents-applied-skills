<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif"><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1B1F2A" flood-opacity="0.10"/></filter><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6475"/></marker><marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B3FD6"/></marker></defs><rect width="1200" height="470" fill="#F4F6FB"/><text x="40" y="46" font-size="12" fill="#5B3FD6" font-weight="700" text-anchor="start" xml:space="preserve">CONCEPTO CLAVE</text><text x="40" y="76" font-size="24" fill="#1B1F2A" font-weight="700" text-anchor="start" xml:space="preserve">¿Dónde se procesan los datos?</text><text x="40" y="100" font-size="14" fill="#5B6475" font-weight="400" text-anchor="start" xml:space="preserve">El tipo de despliegue define la frontera de procesamiento de las peticiones</text><rect x="40" y="128" width="540" height="300" rx="16" fill="#FFFFFF" stroke="#D9DEE8" stroke-width="1" /><text x="64" y="166" font-size="18" fill="#1F6FD1" font-weight="700" text-anchor="start" xml:space="preserve">Global Standard</text><text x="64" y="190" font-size="13" fill="#5B6475" font-weight="400" text-anchor="start" xml:space="preserve">Puede procesarse en cualquier región de Azure</text><rect x="64" y="206" width="492" height="150" rx="12" fill="#E6F0FC" stroke="#E6F0FC" stroke-width="1" /><circle cx="130" cy="262" r="22" fill="#1F6FD1" stroke="#1F6FD1" stroke-width="2"/><text x="130" y="302" font-size="12" fill="#1B1F2A" font-weight="600" text-anchor="middle" xml:space="preserve">EE. UU.</text><circle cx="230" cy="252" r="22" fill="#1F6FD1" stroke="#1F6FD1" stroke-width="2"/><text x="230" y="292" font-size="12" fill="#1B1F2A" font-weight="600" text-anchor="middle" xml:space="preserve">Canadá</text><circle cx="340" cy="262" r="22" fill="#1F6FD1" stroke="#1F6FD1" stroke-width="2"/><text x="340" y="302" font-size="12" fill="#1B1F2A" font-weight="600" text-anchor="middle" xml:space="preserve">Europa</text><circle cx="440" cy="252" r="22" fill="#1F6FD1" stroke="#1F6FD1" stroke-width="2"/><text x="440" y="292" font-size="12" fill="#1B1F2A" font-weight="600" text-anchor="middle" xml:space="preserve">Asia</text><circle cx="510" cy="300" r="22" fill="#1F6FD1" stroke="#1F6FD1" stroke-width="2"/><text x="510" y="340" font-size="12" fill="#1B1F2A" font-weight="600" text-anchor="middle" xml:space="preserve">Brasil</text><text x="64" y="392" font-size="13.5" fill="#1B1F2A" font-weight="600" text-anchor="start" xml:space="preserve">Máxima capacidad · sin frontera geográfica</text><rect x="620" y="128" width="540" height="300" rx="16" fill="#FFFFFF" stroke="#D9DEE8" stroke-width="1" /><text x="644" y="166" font-size="18" fill="#5B3FD6" font-weight="700" text-anchor="start" xml:space="preserve">Data Zone Standard</text><text x="644" y="190" font-size="13" fill="#5B6475" font-weight="400" text-anchor="start" xml:space="preserve">Se procesa solo dentro de la zona del proyecto</text><rect x="644" y="206" width="492" height="150" rx="12" fill="#ECE8FF" stroke="#ECE8FF" stroke-width="1" /><circle cx="710" cy="262" r="22" fill="#5B3FD6" stroke="#5B3FD6" stroke-width="2"/><text x="710" y="302" font-size="12" fill="#1B1F2A" font-weight="600" text-anchor="middle" xml:space="preserve">US Este</text><circle cx="810" cy="252" r="22" fill="#5B3FD6" stroke="#5B3FD6" stroke-width="2"/><text x="810" y="292" font-size="12" fill="#1B1F2A" font-weight="600" text-anchor="middle" xml:space="preserve">US Oeste</text><circle cx="920" cy="262" r="16" fill="#fff" stroke="#5B3FD6" stroke-width="2"/><text x="920" y="302" font-size="12" fill="#5B6475" font-weight="400" text-anchor="middle" xml:space="preserve">Europa</text><circle cx="1020" cy="252" r="16" fill="#fff" stroke="#5B3FD6" stroke-width="2"/><text x="1020" y="292" font-size="12" fill="#5B6475" font-weight="400" text-anchor="middle" xml:space="preserve">Asia</text><circle cx="1090" cy="300" r="16" fill="#fff" stroke="#5B3FD6" stroke-width="2"/><text x="1090" y="340" font-size="12" fill="#5B6475" font-weight="400" text-anchor="middle" xml:space="preserve">Brasil</text><text x="644" y="392" font-size="13.5" fill="#1B1F2A" font-weight="600" text-anchor="start" xml:space="preserve">✔ Lo que pide el lab: datos dentro de la data zone</text><rect x="664" y="226" width="200" height="110" rx="14" fill="none" stroke="#5B3FD6" stroke-width="2" stroke-dasharray="6 5"/><text x="764" y="222" font-size="11.5" fill="#5B3FD6" font-weight="700" text-anchor="middle" xml:space="preserve">Data zone (p. ej. US)</text></svg>