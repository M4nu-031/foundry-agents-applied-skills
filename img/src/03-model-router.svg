780" y="392" width="380" height="188" rx="12" fill="#FFF1E3" stroke="#B4570B" stroke-width="1.2" /><rect x="780" y="392" width="6" height="188" rx="3" fill="#B4570B"/><text x="800" y="420" font-size="14.5" fill="#B4570B" font-weight="700" text-anchor="start" xml:space="preserve">Importante</text><text x="800" y="446" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">El TPM y el guardrail del router</text><text x="800" y="468" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">aplican a todos los modelos que</text><text x="800" y="490" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">el router elige por dentro.</text><text x="800" y="512" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">No configures nada en los modelos</text><text x="800" y="534" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">subyacentes ni crees un router</text><text x="800" y="556" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">nuevo: edita el existente.</text></svg>