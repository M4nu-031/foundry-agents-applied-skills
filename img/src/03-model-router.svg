<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif"><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1B1F2A" flood-opacity="0.10"/></filter><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6475"/></marker><marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B3FD6"/></marker></defs><rect width="1200" height="660" fill="#F4F6FB"/><text x="40" y="46" font-size="12" fill="#5B3FD6" font-weight="700" text-anchor="start" xml:space="preserve">TAREA 1 · PASO B</text><text x="40" y="76" font-size="24" fill="#1B1F2A" font-weight="700" text-anchor="start" xml:space="preserve">Reconfigurar el model-router existente</text><text x="40" y="100" font-size="14" fill="#5B6475" font-weight="400" text-anchor="start" xml:space="preserve">Build → Models → model-router → Edit / Update deployment</text><g filter="url(#sh)"><rect x="40" y="128" width="700" height="500" rx="14" fill="#FFFFFF" stroke="#D9DEE8" stroke-width="1" /></g><path d="M40 142 a14 14 0 0 1 14 -14 h672 a14 14 0 0 1 14 14 v32 h-700 z" fill="#FAFBFE"/><line x1="40" y1="174" x2="740" y2="174" stroke="#D9DEE8"/><circle cx="62" cy="151" r="5.5" fill="#FF5F57"/><circle cx="80" cy="151" r="5.5" fill="#FEBC2E"/><circle cx="98" cy="151" r="5.5" fill="#28C840"/><text x="130" y="156" font-size="14" fill="#1B1F2A" font-weight="600" text-anchor="start" xml:space="preserve">Update deployment · model-router</text><text x="722" y="156" font-size="12" fill="#5B6475" font-weight="400" text-anchor="end" xml:space="preserve">Existente</text><text x="96" y="206" font-size="12.5" fill="#5B6475" font-weight="600" text-anchor="start" xml:space="preserve">Deployment name</text><rect x="96" y="214" width="600" height="38" rx="8" fill="#FFFFFF" stroke="#D9DEE8" stroke-width="1" /><text x="108" y="238.0" font-size="14" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">model-router</text><rect x="670" y="231.0" width="12" height="9" rx="2" fill="#5B6475"/><path d="M672 231.0 v-3 a4 4 0 0 1 8 0 v3" fill="none" stroke="#5B6475" stroke-width="1.8"/><text x="96" y="278" font-size="12.5" fill="#5B6475" font-weight="600" text-anchor="start" xml:space="preserve">Deployment type</text><rect x="96" y="286" width="600" height="38" rx="8" fill="#ECE8FF" stroke="#5B3FD6" stroke-width="2" /><text x="108" y="310.0" font-size="14" fill="#1B1F2A" font-weight="600" text-anchor="start" xml:space="preserve">Data Zone Standard</text><path d="M673 302.0 l5 6 l5 -6" fill="none" stroke="#5B6475" stroke-width="2"/><circle cx="74" cy="305.0" r="13" fill="#5B3FD6"/><text x="74" y="310.0" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><text x="96" y="350" font-size="12.5" fill="#5B6475" font-weight="600" text-anchor="start" xml:space="preserve">Tokens per Minute Rate Limit</text><rect x="96" y="358" width="600" height="38" rx="8" fill="#ECE8FF" stroke="#5B3FD6" stroke-width="2" /><text x="108" y="382.0" font-size="14" fill="#1B1F2A" font-weight="600" text-anchor="start" font-family="Cascadia Code, Consolas, Menlo, monospace" xml:space="preserve">50,000</text><circle cx="74" cy="377.0" r="13" fill="#5B3FD6"/><text x="74" y="382.0" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" xml:space="preserve">2</text><text x="96" y="422" font-size="12.5" fill="#5B6475" font-weight="600" text-anchor="start" xml:space="preserve">Guardrails / Content filter</text><rect x="96" y="430" width="600" height="38" rx="8" fill="#ECE8FF" stroke="#5B3FD6" stroke-width="2" /><text x="108" y="454.0" font-size="14" fill="#1B1F2A" font-weight="600" text-anchor="start" xml:space="preserve">Contoso</text><path d="M673 446.0 l5 6 l5 -6" fill="none" stroke="#5B6475" s