<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif"><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1B1F2A" flood-opacity="0.10"/></filter><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6475"/></marker><marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B3FD6"/></marker></defs><rect width="1200" height="980" fill="#F4F6FB"/><text x="40" y="46" font-size="12" fill="#5B3FD6" font-weight="700" text-anchor="start" xml:space="preserve">TAREA 2</text><text x="40" y="76" font-size="24" fill="#1B1F2A" font-weight="700" text-anchor="start" xml:space="preserve">Configurar agent1 en el Agent builder</text><text x="40" y="100" font-size="14" fill="#5B6475" font-weight="400" text-anchor="start" xml:space="preserve">Build → Agents → Create agent → nombre agent1 → configurar y Save</text><g filter="url(#sh)"><rect x="40" y="128" width="760" height="820" rx="14" fill="#FFFFFF" stroke="#D9DEE8" stroke-width="1" /></g><path d="M40 142 a14 14 0 0 1 14 -14 h732 a14 14 0 0 1 14 14 v32 h-760 z" fill="#FAFBFE"/><line x1="40" y1="174" x2="800" y2="174" stroke="#D9DEE8"/><circle cx="62" cy="151" r="5.5" fill="#FF5F57"/><circle cx="80" cy="151" r="5.5" fill="#FEBC2E"/><circle cx="98" cy="151" r="5.5" fill="#28C840"/><text x="130" y="156" font-size="14" fill="#1B1F2A" font-weight="600" text-anchor="start" xml:space="preserve">Agents · agent1</text><text x="782" y="156" font-size="12" fill="#5B6475" font-weight="400" text-anchor="end" xml:space="preserve">Playground / Setup</text><text x="96" y="204" font-size="12.5" fill="#5B6475" font-weight="600" text-anchor="start" xml:space="preserve">Agent name</text><rect x="96" y="212" width="320" height="38" rx="8" fill="#FFFFFF" stroke="#D9DEE8" stroke-width="1" /><text x="108" y="236.0" font-size="14" fill="#1B1F2A" font-weight="400" text-anchor="start" font-family="Cascadia Code, Consolas, Menlo, monospace" xml:space="preserve">agent1</text><rect x="390" y="229.0" width="12" height="9" rx="2" fill="#5B6475"/><path d="M392 229.0 v-3 a4 4 0 0 1 8 0 v3" fill="none" stroke="#5B6475" stroke-width="1.8"/><circle cx="74" cy="231.0" r="13" fill="#5B3FD6"/><text x="74" y="236.0" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" xml:space="preserve">1</text><text x="472" y="204" font-size="12.5" fill="#5B6475" font-weight="600" text-anchor="start" xml:space="preserve">Display name</text><rect x="472" y="212" width="300" height="38" rx="8" fill="#ECE8FF" stroke="#5B3FD6" stroke-width="2" /><text x="484" y="236.0" font-size="14" fill="#1B1F2A" font-weight="600" text-anchor="start" xml:space="preserve">Sales Analyzer</text><circle cx="450" cy="231.0" r="13" fill="#5B3FD6"/><text x="450" y="236.0" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" xml:space="preserve">2</text><text x="96" y="276" font-size="12.5" fill="#5B6475" font-weight="600" text-anchor="start" xml:space="preserve">Description</text><rect x="96" y="284" width="676" height="38" rx="8" fill="#ECE8FF" stroke="#5B3FD6" stroke-width="2" /><text x="108" y="308.0" font-size="14" fill="#1B1F2A" font-weight="600" text-anchor="start" xml:space="preserve">This agent analyzes Northwind Traders historical sales data.</text><circle cx="74" cy="303.0" r="13" fill="#5B3FD6"/><text x="74" y="308.0" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" xml:space="preserve">3</text><text x="96" y="348" font-size="12.5" fill="#5B6475" font-weight="600" text-anchor="start" xml:space="preserve">Model</text><rect x="96" y="356" width="440" height="38" rx="8" fill="#ECE8FF" stroke="#5B3FD6" stroke-width="2" /><text x="108" y="380.0" font-size="14" fill="#1B1F2A" font-weight="600" text-anchor="start" font-family="Cascadia Code, Consolas, Menlo, monospace" xml:space="preserve">gpt-5-mini</text><path d="M513 372.0 l5 6 l5 -6" fill="none" stroke="#5B6475" stroke-width="2"/><circle cx="74" cy="375.0" r="13" fill="#5B3FD6"/><text x="74" y="380.0" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" xml:space="preserve">4</text><text x="566" y="348" font-size="12.5" fill="#5B6475" font-weight="600" text-anchor="start" xml:space="preserve">Reasoning effort</text><rect x="566" y="356" width="66" height="38" rx="8" fill="#fff" stroke="#D9DEE8" stroke-width="1" /><text x="599" y="380" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="middle" xml:space="preserve">Low</text><rect x="635" y="356" width="66" height="38" rx="8" fill="#5B3FD6" stroke="#5B3FD6" stroke-width="1" /><text x="668" y="380" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" xml:space="preserve">Medium</text><rect x="704" y="356" width="66" height="38" rx="8" fill="#fff" stroke="#D9DEE8" stroke-width="1" /><text x="737" y="380" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="middle" xml:space="preserve">High</text><circle cx="796" cy="375" r="13" fill="#5B3FD6"/><text x="796" y="380" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" xml:space="preserve">5</text><text x="96" y="424" font-size="12.5" fill="#5B6475" font-weight="600" text-anchor="start" xml:space="preserve">Instructions</text><circle cx="74" cy="470" r="13" fill="#5B3FD6"/><text x="74" y="475" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" xml:space="preserve">6</text><rect x="96" y="432" width="676" height="176" rx="8" fill="#ECE8FF" stroke="#5B3FD6" stroke-width="2" /><text x="110" y="458" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" font-family="Cascadia Code, Consolas, Menlo, monospace" xml:space="preserve">You reason over Excel sheets that contain sales data. Answer only</text><text x="110" y="482" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" font-family="Cascadia Code, Consolas, Menlo, monospace" xml:space="preserve">questions that can be answered from the uploaded Excel sales data. Use</text><text x="110" y="506" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" font-family="Cascadia Code, Consolas, Menlo, monospace" xml:space="preserve">the workbook as the sole source of truth for summaries, calculations,</text><text x="110" y="530" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" font-family="Cascadia Code, Consolas, Menlo, monospace" xml:space="preserve">comparisons, trends, and anomalies. Do not use outside knowledge. If a</text><text x="110" y="554" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" font-family="Cascadia Code, Consolas, Menlo, monospace" xml:space="preserve">question is out of scope, say: "I can only answer questions based on</text><text x="110" y="578" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" font-family="Cascadia Code, Consolas, Menlo, monospace" xml:space="preserve">the uploaded Excel sales data."</text><text x="96" y="640" font-size="12.5" fill="#5B6475" font-weight="600" text-anchor="start" xml:space="preserve">Tools</text><circle cx="74" cy="680" r="13" fill="#5B3FD6"/><text x="74" y="685" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" xml:space="preserve">7</text><rect x="96" y="650" width="676" height="62" rx="8" fill="#fff" stroke="#5B3FD6" stroke-width="2" /><rect x="110" y="664" width="34" height="34" rx="8" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1" /><text x="127" y="687" font-size="12" fill="#0F8A5F" font-weight="700" text-anchor="middle" font-family="Cascadia Code, Consolas, Menlo, monospace" xml:space="preserve">&lt;/&gt;</text><text x="156" y="678" font-size="14" fill="#1B1F2A" font-weight="700" text-anchor="start" xml:space="preserve">Code interpreter</text><text x="156" y="698" font-size="12" fill="#5B6475" font-weight="400" text-anchor="start" xml:space="preserve">1 archivo adjunto</text><rect x="616" y="668" width="140" height="26" rx="13" fill="#E3F5EC" stroke="#E3F5EC" stroke-width="1" /><text x="686.0" y="685.5" font-size="12.5" fill="#0F8A5F" font-weight="600" text-anchor="middle" xml:space="preserve">📄 Northwind.xlsx</text><text x="96" y="744" font-size="12.5" fill="#5B6475" font-weight="600" text-anchor="start" xml:space="preserve">Knowledge</text><rect x="96" y="752" width="676" height="40" rx="8" fill="#fff" stroke="#D9DEE8" stroke-width="1" /><text x="110" y="777" font-size="13" fill="#5B6475" font-weight="400" text-anchor="start" font-style="italic" xml:space="preserve">Sin cambios (no se pide)</text><rect x="652" y="860" width="120" height="38" rx="8" fill="#5B3FD6" stroke="#5B3FD6" stroke-width="1" /><text x="712.0" y="884" font-size="14" fill="#fff" font-weight="600" text-anchor="middle" xml:space="preserve">Save</text><circle cx="794" cy="879" r="13" fill="#5B3FD6"/><text x="794" y="884" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" xml:space="preserve">8</text><text x="96" y="884" font-size="12" fill="#5B6475" font-weight="400" text-anchor="start" font-style="italic" xml:space="preserve">Cada Save crea una nueva versión del agente.</text><rect x="830" y="150" width="330" height="232" rx="12" fill="#ECE8FF" stroke="#5B3FD6" stroke-width="1.2" /><rect x="830" y="150" width="6" height="232" rx="3" fill="#5B3FD6"/><text x="850" y="178" font-size="14.5" fill="#5B3FD6" font-weight="700" text-anchor="start" xml:space="preserve">Orden recomendado</text><text x="850" y="204" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">1  Crear agente con nombre agent1</text><text x="850" y="226" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">2  Display name: Sales Analyzer</text><text x="850" y="248" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">3  Description (texto exacto)</text><text x="850" y="270" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">4  Modelo: gpt-5-mini (el tuyo)</text><text x="850" y="292" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">5  Reasoning effort: Medium</text><text x="850" y="314" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">6  Pegar instrucciones exactas</text><text x="850" y="336" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">7  Code interpreter + Northwind.xlsx</text><text x="850" y="358" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">8  Save</text><rect x="830" y="472" width="330" height="166" rx="12" fill="#FFF1E3" stroke="#B4570B" stroke-width="1.2" /><rect x="830" y="472" width="6" height="166" rx="3" fill="#B4570B"/><text x="850" y="500" font-size="14.5" fill="#B4570B" font-weight="700" text-anchor="start" xml:space="preserve">No confundir</text><text x="850" y="526" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">agent1 = nombre técnico (no</text><text x="850" y="548" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">se puede cambiar después).</text><text x="850" y="570" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">Sales Analyzer = nombre visible.</text><text x="850" y="592" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">Si escribes mal agent1, borra</text><text x="850" y="614" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">y crea el agente de nuevo.</text><rect x="830" y="694" width="330" height="122" rx="12" fill="#E3F5EC" stroke="#0F8A5F" stroke-width="1.2" /><rect x="830" y="694" width="6" height="122" rx="3" fill="#0F8A5F"/><text x="850" y="722" font-size="14.5" fill="#0F8A5F" font-weight="700" text-anchor="start" xml:space="preserve">Copia literal</text><text x="850" y="748" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">Instrucciones y descripción se</text><text x="850" y="770" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">validan por texto: pégalos desde</text><text x="850" y="792" font-size="13" fill="#1B1F2A" font-weight="400" text-anchor="start" xml:space="preserve">la guía, con comillas y punto.</text></svg>